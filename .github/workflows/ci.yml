name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub deletes caches that are not read for 7 days. Running twice a week keeps the vcpkg cache alive after a
  # pause in the commits, so OpenCASCADE (about two hours to build on Windows) is not compiled again.
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
    inputs:
      macos:
        description: Also build on macOS (in private repositories macOS minutes cost 10x Linux ones)
        type: boolean
        default: false

# Runs of the same branch queue instead of overlapping or cancelling each other. A run with a cold cache is compiling
# OpenCASCADE: cancelling it would throw that work away, because vcpkg stores a package only when it's complete, and
# running another in parallel would compile it twice. The queued run finds the cache saved by the first one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows always runs: it's the platform not covered by local development on the Mac.
        os: ${{ fromJSON(inputs.macos && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # vcpkg stores every built package here; the folder is cached between runs, so OpenCASCADE is built only once.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      NATIVE_PRESET: ${{ startsWith(matrix.os, 'windows') && 'windows' || 'macos' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Compute vcpkg cache key
        id: vcpkg-key
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "prefix=vcpkg-${{ runner.os }}-$(git rev-parse HEAD:external/vcpkg)-${{ hashFiles('native/vcpkg.json', 'native/ports/**', 'native/triplets/**') }}" >> "$GITHUB_OUTPUT"

      # A cache entry can never be overwritten, so a run that adds packages stores a new entry, whose key ends with the
      # run id, and the newest entry with the same prefix is restored. With a fixed key, an incomplete entry (saved by a
      # cancelled run, for example) would be restored as an exact match and the complete one could never be stored.
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.vcpkg-key.outputs.prefix }}-
            vcpkg-${{ runner.os }}-

      - name: Fingerprint the restored packages
        id: vcpkg-before
        shell: bash
        run: echo "hash=${{ hashFiles('.vcpkg-cache/**') }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build --configuration Release

      # Saved even when a later step fails, so a successful OpenCASCADE build is never lost, but not when the run is
      # cancelled (the cache would be incomplete) and only if the build added packages.
      - name: Save vcpkg cache
        if: ${{ !cancelled() && hashFiles('.vcpkg-cache/**') != steps.vcpkg-before.outputs.hash }}
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test (.NET)
        run: dotnet test --configuration Release --no-build

      - name: Test (C++)
        working-directory: native
        run: ctest --preset ${{ env.NATIVE_PRESET }}-release
